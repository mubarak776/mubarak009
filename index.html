<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#f2f8f4; --bg2:#e6f6ec; --card:#ffffff; --ink:#0d1b14; --muted:#8a97a6; --line:#e7eee9;
  --g1:#0e8a43; --g2:#26c95f; --gdark:#0a6a35; --gsoft:#e8f9ef; --gtxt:#12a150;
  --blue:#2563eb; --bsoft:#e8f0ff; --psoft:#f7e8ff; --ysoft:#fff3d1; --rsoft:#ffe6ee; --orange:#e2560f;
  --danger:#e5484d; --dsoft:#fde7e8; --shadow:0 6px 22px rgba(15,60,35,.08);
  --font:'Plus Jakarta Sans','Hind Siliguri','Noto Sans Bengali','Segoe UI',system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0b1411; --bg2:#0f1d17; --card:#13201a; --ink:#ecf6ef; --muted:#8ea699; --line:#213229;
  --gsoft:#12301f; --gtxt:#3ddc7a; --bsoft:#14213d; --psoft:#2a1a3d; --ysoft:#3a2f12; --rsoft:#3d1a26;
  --dsoft:#3a1a1c; --shadow:0 6px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 260px)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.ic{flex:none;display:block}
#root{max-width:520px;margin:0 auto;padding:14px 14px calc(118px + env(safe-area-inset-bottom))}
.view{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* avatar */
.av{position:relative;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;color:#fff;font-weight:700;flex:none;box-shadow:0 0 0 3px var(--card),0 4px 12px rgba(0,0,0,.12)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* home header */
.hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hd-t{flex:1;min-width:0}
.hd h1{font-size:21px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap;letter-spacing:-.2px}
.hd p{color:var(--muted);font-size:13px;margin:2px 0 8px}
.hd p b{color:var(--gtxt)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent}
.bell{width:48px;height:48px;border-radius:50%;background:var(--gsoft);color:var(--gtxt);display:grid;place-items:center;flex:none}

/* balance card */
.bal{position:relative;display:flex;border-radius:28px;padding:20px 18px;color:#fff;overflow:hidden;min-height:170px;
  background:radial-gradient(120% 140% at 85% 60%,#32d16b 0,#17a34e 45%,#0b6a35 100%);box-shadow:0 14px 30px rgba(14,138,67,.32)}
.bal::after{content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08)}
.bal-l{position:relative;z-index:2;flex:1;min-width:0}
.bal-lb{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;opacity:.95}
.eye{display:grid;place-items:center;color:#fff}
.bal-v{font-size:38px;font-weight:800;letter-spacing:-1px;margin:4px 0 8px;line-height:1.05}
.bal-s{font-size:12.5px;opacity:.9}
.bal-a{font-size:17px;font-weight:800;color:#fde68a;margin-bottom:12px}
.wbtn{display:inline-flex;align-items:center;gap:9px;background:#fff;color:#0e6b35;padding:10px 12px 10px 16px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.16)}
.wbtn i{width:24px;height:24px;border-radius:50%;background:#dff7e7;display:grid;place-items:center;font-style:normal}
.bal-art{position:absolute;z-index:1;right:-6px;bottom:-4px;width:56%;max-width:250px}
.bal-art svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25))}
.bal.compact{min-height:0;padding-bottom:14px;flex-direction:column}
.bal.compact .bal-v{font-size:34px}
.bal3{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);text-align:center}
.bal3 b{display:block;font-size:20px;font-weight:800}
.bal3 span{font-size:11px;opacity:.9}

/* section heads */
.sh{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.sh h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px}
.sh .tile{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.sh a,.sh button.lnk{color:var(--gtxt);font-weight:700;font-size:13px}
.sh.bar h2::before{content:"";width:4px;height:18px;border-radius:4px;background:var(--gtxt)}

/* summary cards */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sc{border-radius:22px;padding:12px 12px 10px}
.sc .ico{width:40px;height:40px;border-radius:13px;background:var(--card);display:grid;place-items:center;margin-bottom:8px;color:var(--ink)}
.sc small{display:block;font-size:11.5px;color:var(--muted)}
.sc b{display:block;font-size:17px;font-weight:800;margin:1px 0 6px}
.sc svg.sp{width:100%;height:26px;display:block}
.sc.g{background:var(--gsoft)} .sc.b{background:var(--bsoft)} .sc.p{background:var(--psoft)}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 6px 12px;text-align:center;box-shadow:var(--shadow)}
.qa .t{width:52px;height:52px;border-radius:17px;margin:0 auto 9px;display:grid;place-items:center}
.qa b{display:block;font-size:12.5px;font-weight:800;line-height:1.25}
.qa small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.t-g{background:var(--gsoft);color:#12a150}.t-y{background:var(--ysoft);color:#c2790a}.t-r{background:var(--rsoft);color:#d6336c}.t-b{background:var(--bsoft);color:#2563eb}

.promo{margin-top:16px;border-radius:22px;padding:16px;background:linear-gradient(135deg,var(--gsoft),var(--card));border:1px dashed #9ddfb6;display:flex;align-items:center;justify-content:space-between;gap:10px}
.promo b{display:block;font-size:15px}.promo small{color:var(--muted)}
.sponsor{position:relative;margin-top:16px;border-radius:22px;padding:22px 14px 14px;background:var(--card);border:1px dashed #b5c3d3;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);width:100%;text-align:left}
.sponsor .sp-tag{position:absolute;top:-10px;left:16px;background:#64748b;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:3px 10px;border-radius:99px}
.sponsor .si{width:48px;height:48px;border-radius:15px;background:var(--bsoft);color:#2563eb;display:grid;place-items:center;flex:none}
.sponsor div{flex:1;min-width:0}.sponsor b{display:block;font-size:14.5px}.sponsor small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}

/* earn page */
.eh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.eh h1{font-size:28px;font-weight:800;letter-spacing:-.4px}
.eh h1 span{color:var(--gtxt)}
.eh p{color:var(--muted);font-size:12.5px;margin:3px 0 10px}
.eh .art{width:84px;flex:none}.eh .art svg{width:100%;height:auto;display:block}
.streak{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--orange)}
.filters{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fl{flex:none;min-width:72px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;gap:6px;font-size:12px;font-weight:700;color:#516070}
.fl.on{background:var(--gsoft);border-color:#8ed9a9;color:var(--gtxt)}
.fl .fi{width:26px;height:26px;display:grid;place-items:center;border-radius:8px}
.note{padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:600;margin:12px 0;background:var(--gsoft);color:#0f7d3d;border:1px solid #bdebcf}
.note.err{background:var(--dsoft);color:#b3262b;border-color:#f6c1c3}
.tasks{display:grid;gap:12px;margin-top:10px}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px 12px;box-shadow:var(--shadow)}
.task .ti{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.task .tx{flex:1;min-width:0}
.task h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--rsoft);color:#d6336c}
.task p{font-size:11.5px;color:var(--muted);margin:3px 0 4px}
.task .rw{font-size:12.5px;font-weight:800;color:var(--orange);display:flex;align-items:center;gap:5px}
.coin{width:15px;height:15px;border-radius:50%;background:#f59e0b;display:inline-grid;place-items:center;color:#fff;font-size:9px;font-weight:800;flex:none}
.ring{position:relative;width:60px;height:60px;flex:none;text-align:center}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;line-height:1.05;color:#4b5a69}
.ring small{position:absolute;left:0;right:0;bottom:-15px;font-size:10px;color:var(--muted);font-weight:500}
.task .ac{flex:none;display:grid;place-items:center;min-width:76px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 15px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:800;font-size:13px;box-shadow:0 6px 14px rgba(20,160,80,.28);white-space:nowrap}
.btn.grey{background:#a3afbf;box-shadow:none;color:#fff}
.btn.blue{background:linear-gradient(135deg,#1d4ed8,#3b82f6);box-shadow:0 6px 14px rgba(37,99,235,.28)}
.btn.block{width:100%;min-height:54px;border-radius:18px;font-size:16px}
.btn[disabled]{opacity:.7;pointer-events:none}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* refer */
.rb{position:relative;border-radius:26px;padding:20px 18px;color:#fff;overflow:hidden;min-height:150px;background:radial-gradient(120% 140% at 90% 50%,#32d16b 0,#17a34e 50%,#0b6a35 100%);box-shadow:0 14px 30px rgba(14,138,67,.3)}
.rb h2{font-size:15px;font-weight:700;opacity:.95;max-width:62%}
.rb h1{font-size:28px;font-weight:800;line-height:1.1;margin:6px 0 12px;max-width:62%}
.rb .gp{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;max-width:70%}
.rb .art{position:absolute;right:-8px;bottom:-6px;width:44%}.rb .art svg{width:100%;height:auto;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.lnkbox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px;margin-top:10px}
.lnkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#4b5a69}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.share{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.share button{display:grid;gap:6px;justify-items:center;font-size:11.5px;color:#516070}
.share i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;background:var(--gsoft);border-radius:22px;padding:16px 8px}
.stats3 .ico{color:var(--gtxt);display:grid;place-items:center;margin-bottom:4px}
.stats3 b{display:block;font-size:20px;font-weight:800}
.stats3 small{font-size:11px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 10px}
.rl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rl:last-child{border:0}
.rl .n{flex:1;min-width:0}.rl .n b{display:block;font-size:14px}.rl .n small{color:var(--muted);font-size:11.5px}
.rl .v{font-weight:800;color:var(--gtxt)}

/* withdraw */
.wh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.wh h1{font-size:28px;font-weight:800;display:flex;align-items:center;gap:8px}
.wh p{color:var(--muted);font-size:13px;margin-top:2px}
.gbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700;font-size:12.5px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mth{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 8px;text-align:center;display:grid;gap:4px;justify-items:center;box-shadow:var(--shadow)}
.mth.on{border-color:var(--g2);background:var(--gsoft)}
.mth .chk{position:absolute;top:-9px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--g2);color:#fff;display:none;place-items:center}
.mth.on .chk{display:grid}
.mth b{font-size:15px}.mth small{color:var(--gtxt);font-weight:700;font-size:11px}
.mlogo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.secure{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--gsoft);color:#0f7d3d;border:1px solid #bdebcf;border-radius:14px;padding:11px;font-size:12.5px;font-weight:600;margin:14px 0 10px}
.minref{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:var(--gsoft);border-radius:14px;padding:11px;font-size:12px;color:#3c6a51;font-weight:600}
.minref b{color:#0f7d3d}
label.fl2{display:block;font-weight:800;font-size:13.5px;margin:16px 0 8px}
.inp{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;min-height:50px}
.inp:focus-within{border-color:var(--g2)}
.inp input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;padding:12px 0}
.inp .cur{font-weight:800;color:var(--muted)}
.all{background:var(--gsoft);color:var(--gtxt);font-weight:800;font-size:12.5px;padding:6px 12px;border-radius:10px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.quick button{padding:8px 13px;border-radius:999px;background:var(--gsoft);color:var(--gtxt);font-weight:800;font-size:12.5px;border:1.5px solid transparent}
.quick button.on{border-color:var(--g2)}
.hist{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px}
.hi{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hi:last-child{border:0}
.hi .n{flex:1}.hi .n b{display:block;font-size:14px}.hi .n small{color:var(--muted);font-size:11.5px}
.st{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
.st.pending{background:var(--ysoft);color:#b7791f}.st.paid{background:var(--gsoft);color:#0f7d3d}.st.rejected{background:var(--dsoft);color:#b3262b}

/* leaderboard */
.lbh{position:relative;border-radius:26px;padding:18px;color:#fff;overflow:hidden;background:radial-gradient(120% 140% at 90% 30%,#2ecb66 0,#12994a 48%,#0a5e30 100%);box-shadow:0 14px 30px rgba(14,138,67,.3)}
.lbh .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;opacity:.95}
.lbh h1{font-size:30px;font-weight:800;margin:4px 0 4px}
.lbh p{font-size:12.5px;opacity:.92;margin-bottom:14px}
.me{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:10px 12px}
.me .n{flex:1;min-width:0}.me .n b{display:block}.me .n small{opacity:.85;font-size:11.5px}
.me .v{text-align:right}.me .v b{font-size:20px;display:block}.me .v small{font-size:10.5px;opacity:.85}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin:18px 0}
.pd{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 6px 12px;text-align:center;box-shadow:var(--shadow);display:grid;justify-items:center;gap:3px}
.pd.first{padding-top:18px;border-color:#f6d365;box-shadow:0 10px 26px rgba(245,158,11,.22)}
.pd .crown{font-size:20px;line-height:1}
.pd .rk{font-size:12px;font-weight:800;color:var(--gtxt)}
.pd b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.pd small{font-size:11px;color:var(--muted)}
.pd .cnt{font-size:12px;font-weight:800;color:var(--gtxt)}
.rk-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.rk-row.me{border-color:var(--g2)}
.rk-row .no{width:34px;color:var(--muted);font-weight:800;font-size:13px}
.rk-row .n{flex:1;min-width:0}.rk-row .n b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk-row .n small{color:var(--muted);font-size:11.5px}
.rk-row .v{text-align:right}.rk-row .v b{display:block;font-size:17px;color:var(--gtxt)}.rk-row .v small{font-size:10.5px;color:var(--muted)}

/* profile */
.pt{display:flex;justify-content:flex-end;margin-bottom:-6px}
.theme{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ph h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:6px}
.ph small{color:var(--muted);font-size:13px;display:block;margin:2px 0 8px}
.lvl{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.lvl b{display:flex;align-items:center;gap:7px;font-size:14px}
.lvl .bar{height:7px;border-radius:9px;background:var(--line);margin:9px 0 6px;overflow:hidden}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:9px}
.lvl small{color:var(--muted);font-size:11.5px}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 6px;text-align:center;margin:14px 0}
.pstats .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px}
.pstats b{display:block;font-size:16px;font-weight:800}.pstats small{font-size:10px;color:var(--muted)}

function avatar(name, photo, size) {
  size = size || 56;
  const ini = (name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?';
  const hue = [...String(name)].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * .36)}px;background:linear-gradient(135deg,hsl(${hue} 70% 62%),hsl(${(hue + 40) % 360} 70% 50%))`;
  return `<span class="av" style="${st}"><b>${esc(ini)}</b>${photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>`;
}

async function api(path, body) {
  const h = { 'Content-Type': 'application/json' };
  if (tg && tg.initData) h['X-Init-Data'] = tg.initData;
  else if (DEV) h['X-Dev-User'] = DEV;
  try {
    const r = await fetch(path, { method: 'POST', headers: h, body: JSON.stringify(body || {}) });
    return await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
}
const errText = r => {
  if (!r) return t('e_network');

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};

function openExternal(url) {
  if (!url) return;
  if (/^https?:\/\/(t\.me|telegram\.me)\//i.test(url) && tg && tg.openTelegramLink) tg.openTelegramLink(url);
  else if (tg && tg.openLink) tg.openLink(url);

}
function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).catch(() => fallbackCopy(txt));
  fallbackCopy(txt);
}
function fallbackCopy(txt) {
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove();
}

  const rows = top.map(p => `<div class="rk-row ${p.me ? 'me' : ''}"><span class="no">#${p.rank}</span>${avatar(p.name, p.photo, 44)}<div class="n"><b>${esc(p.name)}</b><small>${t('lvl_refs', { l: p.level, n: p.refs })}</small></div><div class="v"><b>${p.refs}</b><small>${t('refs_word')}</small></div></div>`).join('');
  return `<div class="view">
  <div class="lbh"><div class="k">${ic('trophy', 15)} ${t('lb_k')}</div><h1>${t('lb_h')}</h1><p>${t('lb_sub')}</p>
    <div class="me">${avatar(m.name, m.photo, 44)}<div class="n"><b>${esc(m.name)} · ${t('you')}</b><small>${d.me.rank ? '#' + d.me.rank : t('lb_join')}</small></div><div class="v"><b>${m.refs}</b><small>${t('refs_word')}</small></div></div></div>
  ${top.length ? pod : `<div class="card empty" style="margin-top:14px">${t('lb_empty')}</div>`}
  ${top.length ? `<div class="sh"><h2><span class="tile t-g">${ic('trophy', 17)}</span>${t('ranking')}</h2><small style="color:var(--muted)">${t('n_users', { n: top.length })}</small></div>${rows}` : ''}</div>`;
}

function profileView() {
  const m = S.me, c = S.cfg, lv = m.level_name[S.lang] || m.level_name.en;
  const pct = m.next_at ? Math.max(0, Math.min(100, ((m.refs - m.prev_at) / (m.next_at - m.prev_at)) * 100)) : 100;
  const item = (act, v, cls, icn, title, sub, extra) => `<button class="mi" data-act="${act}" data-v="${v}"><span class="mt ${cls}">${ic(icn, 22)}</span><div><b>${title}</b><small>${sub}</small></div>${extra || ''}<span class="cv">${ic('right', 18)}</span></button>`;
  return `<div class="view">
  <div class="pt"><button class="theme" data-act="theme">${ic(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon', 18)}</button></div>
  <div class="ph">${avatar(m.name, m.photo, 72)}<div><h1>${esc(m.name)} ${VERIFIED}</h1><small>${m.username ? '@' + esc(m.username) : 'ID ' + esc(m.id)}</small>
    <span class="chip on">${ic('star', 15)} ${t('member')}</span></div></div>
  <div class="lvl"><b>${ic('trophy', 16)} ${t('lvl_line', { n: m.level, name: lv })}</b><div class="bar"><i style="width:${pct}%"></i></div>
    <small>${m.next_at ? t('lvl_next', { r: m.refs, m: m.next_at }) : t('lvl_max', { r: m.refs })}</small></div>
  ${balCard(false)}
  <div class="pstats">
    <div><span class="ico t-g">${ic('users', 18)}</span><b>${m.refs}</b><small>${t('total_refs')}</small></div>
    <div><span class="ico t-b">${ic('calcheck', 18)}</span><b>${m.tasks_done}</b><small>${t('tasks_done')}</small></div>
    <div><span class="ico" style="background:var(--psoft);color:#a855f7">${ic('gift', 18)}</span><b>${m.bonus_claimed}</b><small>${t('bonus_claimed')}</small></div>
    <div><span class="ico t-y">${ic('wallet', 18)}</span><b>${money(m.earned)}</b><small>${t('total_income')}</small></div></div>
  <div class="menu">
    ${item('page', 'notif', 't-g', 'bell', t('menu_notif'), t('menu_notif_s'))}
    ${item('page', 'lang', 't-b', 'globe', t('menu_lang'), t('menu_lang_s'), `<span class="lang-pill">${S.lang === 'bn' ? 'বাংলা' : 'English'}</span>`)}
    ${item('help', '', 't-y', 'help', t('menu_help'), t('menu_help_s'))}
    ${item('about', '', 't-r', 'info', t('menu_about', { app: esc(c.app_name) }), t('menu_about_s'))}
  </div>
  <div class="enc"><div style="flex:1"><b>${t('keep_going')}</b><small>${t('keep_going_s')}</small></div><span style="color:var(--gtxt)">${ic('shield', 44, 1.6)}</span></div></div>`;
}

function langView() {
  const pick = S.langPick || S.lang;
  return `<div class="view"><button class="back" data-act="tab" data-v="profile">${ic('back', 22)}</button>
  <h1 class="sp-t">${t('lang_t')}</h1>${flashHtml()}
  ${LANGS.map(l => `<button class="opt ${pick === l.code ? 'on' : ''}" data-act="langpick" data-v="${l.code}"><span class="fg">${l.flag}</span><div><b>${l.name}</b><small>${t('code')}: ${l.code}</small></div><span class="radio"></span></button>`).join('')}
  <button class="btn block" style="margin-top:8px" data-act="langsave">${t('save')}</button></div>`;
}
function notifView() {
  const n = S.notif;
  const row = (k, a, b) => `<div class="cbrow"><div><b>${a}</b><small>${b}</small></div><button class="sw ${n[k] ? 'on' : ''}" data-act="ntoggle" data-v="${k}" aria-label="${a}"></button></div>`;
  return `<div class="view"><button class="back" data-act="tab" data-v="profile">${ic('back', 22)}</button>
  <h1 class="sp-t">${t('notif_t')}</h1>${flashHtml()}
  <div class="card" style="padding:6px 14px">${row('push', t('n_push'), t('n_push_s'))}${row('withdraw', t('n_wd'), t('n_wd_s'))}${row('promo', t('n_promo'), t('n_promo_s'))}</div>
  <button class="btn block" style="margin-top:16px" data-act="notifsave">${t('save_pref')}</button></div>`;
}

function landingView() {
  const c = S.cfg || { app_name: 'Cash Flow BD', bot: 'CashFlowBD24_Bot' };
  return `<div class="center"><div class="box"><img class="lg" src="/logo.svg" alt="">
    <h1>Cash Flow <span>BD</span></h1><p>${t('land_p')}</p>
    <button class="btn block" data-act="opentg">${ic('send', 20)} ${t('open_tg')}</button>
    <div class="feat"><div>${ic('video', 24)}${t('f_ads')}</div><div>${ic('users', 24)}${t('f_refer')}</div><div>${ic('wallet', 24)}${t('f_cash')}</div></div></div></div>`;
}
function gateView() {
  return `<div class="center"><div class="box"><img class="lg" src="/logo.svg" alt="">
    <h1>${t('gate_t')}</h1><p>${t('gate_p')}</p>${flashHtml()}
    <button class="btn block" data-act="join">${t('join_ch')}</button>
    <button class="btn block" data-act="verify" id="verify-btn">${t('verify')}</button></div></div>`;
}

const NAV = [['home', 'home', 'nav_home'], ['earn', 'earn', 'nav_earn'], ['refer', 'users', 'nav_refer'], ['withdraw', 'card', 'nav_withdraw'], ['leaderboard', 'trophy', 'nav_lb'], ['profile', 'user', 'nav_profile']];
function navHtml() {
  const cur = S.page ? 'profile' : S.tab;
  return `<nav class="nav">${NAV.map(([k, i, l]) => `<button class="${cur === k ? 'on' : ''}" data-act="tab" data-v="${k}"><span class="ni">${ic(i, 22)}</span><span>${t(l)}</span></button>`).join('')}</nav>`;
}

/* ───────────────── render / routing ───────────────── */
function render() {
  if (!S.me) return;
  let v;
  if (S.page === 'lang') v = langView();
  else if (S.page === 'notif') v = notifView();
  else v = ({ home: homeView, earn: earnView, refer: referView, withdraw: withdrawView, leaderboard: lbView, profile: profileView }[S.tab] || homeView)();
  root.innerHTML = v + navHtml();
  if (tg && tg.BackButton) { try { S.page ? tg.BackButton.show() : tg.BackButton.hide(); } catch (_) {} }
}
function showOverlay(label) {
  const o = $('#overlay');
  o.innerHTML = `<div class="ovc"><b>${esc(S.cfg ? S.cfg.app_name.replace(/\s+/g, '') : 'CashFlowBD')}</b><div class="ring2"></div><small>${t('opening', { x: label })}</small></div>`;
  o.classList.add('on');
}
const hideOverlay = () => $('#overlay').classList.remove('on');

function go(tab, page) {
  const names = { home: 'nav_home', earn: 'nav_earn', refer: 'nav_refer', withdraw: 'nav_withdraw', leaderboard: 'nav_lb', profile: 'nav_profile' };
  const changed = tab !== S.tab || (page || null) !== S.page;
  S.page = page || null;
  if (page === 'notif') S.notif = Object.assign({}, S.me.notif);
  if (page === 'lang') S.langPick = S.lang;
  if (!changed) { window.scrollTo(0, 0); return render(); }
  S.tab = tab;
  if (!page) { showOverlay(t(names[tab])); }
  setTimeout(async () => {
    if (tab === 'leaderboard' && !page) { S.lb = null; render(); S.lb = await api('/api/leaderboard'); }
    if (tab === 'earn' || tab === 'withdraw' || tab === 'refer' || tab === 'profile') { const r = await api('/api/me'); if (r.ok) S.me = r.user; }
    window.scrollTo(0, 0); render(); hideOverlay();
    if (tab === 'leaderboard' && !page) render();
  }, page ? 0 : 320);
}

/* ───────────────── modal ───────────────── */
function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="mbox"><button class="mx" data-act="closem">${ic('x', 18)}</button>${html}</div>`; m.classList.add('on'); }
function closeModal() { const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function tutorialModal() {
  const url = S.cfg.tutorial_url;
  openModal(`<span class="badge">${t('tut_badge')}</span><h2>${t('tut_h')}</h2><p class="sub">${t('tut_s')}</p>
    <div class="vid" data-act="tutorial"><img class="lg" src="/icon-192.png" alt=""><span class="pl">${ic('play', 26)}</span><small>${t('tap_play')}</small></div>
    <button class="btn block" data-act="closem">${t('cont')}</button>`);
}

/* ───────────────── actions ───────────────── */
async function watchAd() {
  if (S.busy.ad) return;
  const m = S.me;
  if (m.ads_left <= 0) return flash('err', t('e_limit'));
  S.busy.ad = true; render();
  const done = () => { S.busy.ad = false; render(); };
  const s = await api('/api/ad/start');
  if (!s.ok) { done(); return flash('err', errText(s)); }
  let shown = false;
  const started = Date.now();
  try {
    const fn = window['show_11845830'];
    if (typeof fn === 'function') { await fn({ ymid: s.nonce }); shown = true; }
    else if (S.cfg.dev) { await new Promise(r => setTimeout(r, (s.min_seconds + 1) * 1000)); shown = true; }  // dev-only simulation
  } catch (e) { shown = false; }
  if (!shown) { done(); return flash('err', typeof window['show_11845830'] === 'function' ? t('e_ad_fail') : t('e_ad_none')); }
  const wait = Math.max(0, s.min_seconds * 1000 - (Date.now() - started));
  if (wait) await new Promise(r => setTimeout(r, wait + 150));
  let r = null;
  for (let i = 0; i < 8; i++) {
    r = await api('/api/ad/complete', { nonce: s.nonce });
    if (!r.pending) break;
    await new Promise(x => setTimeout(x, 1500));
  }
  S.busy.ad = false;
  if (r && r.ok) { S.me = r.user; render(); flash('ok', t('ad_ok', { x: money(r.reward) })); }
  else { render(); flash('err', r && r.pending ? t('e_ad_fail') : errText(r)); }
}
async function claimDaily() {
  const r = await api('/api/daily');
  if (r.ok) { S.me = r.user; render(); flash('ok', t('bonus_ok', { x: money(r.reward) })); }
  else flash('err', errText(r));
}
function tasksSheet(type) {
  const list = tasksOf(type);
  openModal(`<h2>${TT[type].name}</h2><p class="sub">${t(TT[type].d)}</p><div class="tsheet">${list.map(x => `<div class="tr"><div><b>${esc(x.title)}</b><small>${money(x.reward)}</small></div>${x.done
    ? `<button class="btn grey">✓ ${t('done')}</button>`
    : `<button class="btn grey" data-act="topen" data-v="${esc(x.id)}" style="background:#64748b">${t('open')}</button><button class="btn" data-act="tclaim" data-v="${esc(x.id)}">${t('verify_claim')}</button>`}</div>`).join('') || `<div class="empty">${t('no_task')}</div>`}</div>`);
}
async function taskOpen(id) {
  const x = S.me.tasks.find(y => y.id === id); if (!x) return;
  await api('/api/task/start', { id }); openExternal(x.url);
}
async function taskClaim(id, el) {
  el.disabled = true;
  const r = await api('/api/task/claim', { id });
  if (r.ok) { S.me = r.user; closeModal(); render(); flash('ok', t('task_ok', { x: money(r.reward) })); }
  else { el.disabled = false; closeModal(); flash('err', errText(r)); }
}
function shareTo(kind) {
  const txt = t('share_text', { app: S.cfg.app_name }), link = refLink();
  if (kind === 'wa') return openExternal('https://wa.me/?text=' + encodeURIComponent(txt + ' ' + link));
  if (kind === 'tg') return openExternal('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(txt));
  if (kind === 'fb') return openExternal('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(link));
  if (navigator.share) navigator.share({ text: txt, url: link }).catch(() => {});
  else { copyText(txt + ' ' + link); flash('ok', t('copied')); }
}
async function submitWithdraw(el) {
  const w = S.wd; if (el.classList.contains('grey')) {
    const m = S.me, c = S.cfg, amt = Number(w.amount);
    if (!/^(\+?88)?01[3-9]\d{8}$/.test(w.account.replace(/[\s-]/g, ''))) return flash('err', t('e_account'));
    if (!(amt >= c.min_withdraw)) return flash('err', t('e_min', { x: money(c.min_withdraw) }));
    if (amt > m.balance) return flash('err', t('e_balance'));
    return;
  }
  el.classList.add('grey');
  const r = await api('/api/withdraw', { method: w.method, account: w.account, amount: Number(w.amount) });
  if (r.ok) { S.me = r.user; S.wd.amount = ''; render(); flash('ok', t('wd_ok')); }
  else { refreshWd(); flash('err', errText(r)); }
}
function guideModal() {
  const c = S.cfg;
  openModal(`<h2>${t('g_title')}</h2><ul class="rules"><li>${t('g1', { min: money(c.min_withdraw) })}</li><li>${t('g2', { refs: c.min_refs })}</li><li>${t('g3')}</li><li>${t('g4')}</li><li>${t('g5')}</li></ul>`);
}

const ACT = {
  tab: v => go(v),
  page: v => go('profile', v),
  hide: () => { S.hide = !S.hide; render(); },
  filter: v => { S.filter = v; render(); },
  watch: () => watchAd(),
  daily: () => claimDaily(),
  tasks: v => tasksSheet(v),
  topen: v => taskOpen(v),
  tclaim: (v, el) => taskClaim(v, el),
  copy: () => { copyText(refLink()); flash('ok', t('copied')); },
  share: v => shareTo(v),
  method: v => { S.wd.method = v; document.querySelectorAll('.mth').forEach(x => x.classList.toggle('on', x.dataset.v === v)); },
  amt: v => { S.wd.amount = v; const i = $('#wd-amt'); if (i) i.value = v; refreshWd(); },
  all: () => { S.wd.amount = String(Math.floor(S.me.balance)); const i = $('#wd-amt'); if (i) i.value = S.wd.amount; refreshWd(); },
  submit: (v, el) => submitWithdraw(el),
  guide: () => guideModal(),
  sponsor: () => { api('/api/sponsor/click'); openExternal(S.cfg.sponsor_url); },
  theme: () => {
    const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = d; store.set('cf_theme', d); applyChrome(); render();
  },
  help: () => { const u = S.cfg.support_url; if (u) openExternal(u); else openModal(`<h2>${t('menu_help')}</h2><p class="sub">${t('menu_help_s')}</p>`); },
  about: () => openModal(`<h2>${t('about_t')} ${esc(S.cfg.app_name)}</h2><p class="sub" style="font-size:14px;line-height:1.6">${t('about_p')}</p>`),
  langpick: v => { S.langPick = v; render(); },
  langsave: async () => {
    const code = S.langPick || S.lang, r = await api('/api/settings', { lang: code });
    S.lang = code; document.documentElement.lang = code; if (r.ok) S.me = r.user; render(); flash('ok', t('lang_ok'));
  },
  ntoggle: v => { S.notif[v] = !S.notif[v]; const b = document.querySelector(`[data-act="ntoggle"][data-v="${v}"]`); if (b) b.classList.toggle('on', S.notif[v]); },
  notifsave: async () => { const r = await api('/api/settings', { notif: S.notif }); if (r.ok) S.me = r.user; flash('ok', t('saved')); },
  closem: () => closeModal(),
  tutorial: () => { openExternal(S.cfg.tutorial_url); },
  opentg: () => openExternal(`https://t.me/${(S.cfg || {}).bot || 'CashFlowBD24_Bot'}`),
  join: () => openExternal(S.cfg.channel_url),
  verify: async el => {
    const r = await api('/api/verify');
    if (r.ok) { S.me = r.user; start(); } else flash('err', errText(r));
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset.v, el, e);
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  S.wd[k] = e.target.value; refreshWd();
});
if (tg && tg.BackButton) { try { tg.BackButton.onClick(() => go('profile')); } catch (_) {} }

/* ───────────────── boot ───────────────── */
function applyChrome() {
  if (!tg) return;
  const dark = document.documentElement.dataset.theme === 'dark';
  try { tg.setHeaderColor(dark ? '#0b1411' : '#ffffff'); tg.setBackgroundColor(dark ? '#0b1411' : '#f2f8f4'); } catch (_) {}
}
function start() {
  S.tab = 'home';
  const want = qs.get('tab');
  render();
  if (want && ['earn', 'refer', 'withdraw', 'leaderboard', 'profile'].includes(want)) go(want);
  if (S.cfg.tutorial_url && !store.get('cf_tut_seen')) { store.set('cf_tut_seen', '1'); tutorialModal(); }
}
async function boot() {
  const saved = store.get('cf_theme');
  if (saved) document.documentElement.dataset.theme = saved;
  if (tg) { try { tg.ready(); tg.expand(); } catch (_) {} }
  applyChrome();
  try { S.cfg = await (await fetch('/api/config')).json(); } catch (_) { S.cfg = null; }
  document.title = (S.cfg && S.cfg.app_name) || 'Cash Flow BD';
  const inTelegram = !!(tg && tg.initData);
  if (!S.cfg || (!inTelegram && !(DEV && S.cfg.dev))) { root.innerHTML = landingView(); return; }
  const r = await api('/api/me');
  if (!r.ok && r.error === 'banned') { root.innerHTML = `<div class="center"><div class="box"><img class="lg" src="/logo.svg" alt=""><h1>🚫</h1><p>${t('e_banned')}</p></div></div>`; return; }
  if (!r.ok) { root.innerHTML = landingView(); return; }
  S.me = r.user; S.lang = r.user.lang || 'bn'; document.documentElement.lang = S.lang;
  if (r.need_verify) { root.innerHTML = gateView(); return; }
  start();
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !S.me || S.busy.ad) return;
    const x = await api('/api/me'); if (x.ok && !x.need_verify) { S.me = x.user; if (!$('#modal.on') && !document.activeElement.matches('input')) render(); }
  });
}
boot();
})();
</script>
